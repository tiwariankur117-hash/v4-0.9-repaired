<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRA Editor — Creative Workspace</title><link rel="stylesheet" href="editor.css"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body><div class="editor-app"><header class="topbar"><a class="back" href="dashboard.html">← Dashboard</a><div class="logo"><img class="editor-brand-logo" src="vyra-eye-brand.webp" alt="VYRA Studio logo"> VYRA <span>EDITOR</span></div><input id="projectName" aria-label="Project name" value="Untitled project"><span class="top-status" id="status">Ready to create</span><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="save">Save project</button><button class="primary" id="export">↗ Export video</button></header><div class="workspace"><nav class="rail" id="rail"><button data-tab="media" class="active">▣<small>Media</small></button><button data-tab="templates">▦<small>Templates</small></button><button data-tab="text">T<small>Text</small></button><button data-tab="transitions">✧<small>Transitions</small></button><button data-tab="effects">◈<small>Effects</small></button><button data-tab="audio">♫<small>Audio</small></button><button data-tab="captions">▤<small>Captions</small></button></nav><aside class="library"><div class="panel-head"><strong id="panelTitle">My Media</strong><span>✦</span></div><div id="panelContent"></div></aside><main class="stage"><div class="stage-top"><span>PREVIEW</span><div><button id="ratio">16:9 ▾</button><button id="compare">Before / After</button></div></div><div class="stage-center"><div id="canvasWrap"><canvas id="preview" width="1280" height="720"></canvas><video id="sourceVideo" playsinline preload="auto" style="display:none"></video></div></div><div class="transport"><button id="backStart">⏮</button><button id="play">▶</button><button id="forward">⏭</button><span id="timeLabel">00:00 / 00:00</span><input type="range" id="seek" min="0" max="1000" value="0"><button id="mute">♫</button></div></main><aside class="inspector"><div class="panel-head"><strong>Properties</strong><span>⚙</span></div><div id="inspectorContent"><p class="muted">Select a clip or text item to adjust its properties.</p></div></aside><section class="timeline"><div class="timeline-toolbar"><div><strong>Timeline</strong><span class="muted" id="durationLabel">00:00</span></div><div class="tools"><button id="split" title="Split at playhead">✂ Split</button><button id="trim" title="Trim selected clip">↔ Trim</button><button id="duplicate">▣ Duplicate</button><button id="delete">⌫ Delete</button><label>Zoom <input id="zoom" type="range" min="40" max="180" value="80"></label></div></div><div class="timeline-scroll" id="timelineScroll"><div class="ruler" id="ruler"></div><div class="track"><span class="track-label">🎬 Video</span><div class="track-lane" id="videoLane"></div></div><div class="track"><span class="track-label">T Text</span><div class="track-lane" id="textLane"></div></div><div class="track"><span class="track-label">♫ Audio</span><div class="track-lane" id="audioLane"></div></div><div id="playhead"></div></div><div class="timeline-foot"><span>Drag clip edges to trim • Double-click timeline to seek • Drag clips to rearrange</span><span id="exportProgress"></span></div></section></div></div><script src="editor.js"></script></body></html>
